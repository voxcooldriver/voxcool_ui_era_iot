<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VOX Cool Dashboard · Test</title>
<style>
body{font:15px system-ui,sans-serif;margin:0;color:#0b237a;background:#f3f8ff}
#loading{padding:25px;text-align:center}#loading.error{color:#ae2730}
</style>
</head>
<body>
<div id="loading">Đang tải Dashboard VOX Cool thử nghiệm…</div>
<script>
/*
 * Preview-only loader pinned to the tested GitHub commit.
 * Keeps the existing Dashboard/layout intact while applying the energy display rule.
 * For production, incorporate the patch into the full era_dashboard.html source.
 */
(async()=>{
 const sourceUrl="https://cdn.jsdelivr.net/gh/voxcooldriver/voxcool_ui_era_iot@ec6e4997133eca05da6fe5e6bc1ef3280650117d/era_dashboard.html";
 const replaceOnce=(source,from,to)=>{
   const start=source.indexOf(from);
   if(start<0||source.indexOf(from,start+from.length)>=0)throw Error("Không tìm thấy duy nhất vị trí cập nhật: "+from.slice(0,45));
   return source.slice(0,start)+to+source.slice(start+from.length);
 };
 try{
  const response=await fetch(sourceUrl,{cache:"no-cache"});
  if(!response.ok)throw Error("HTTP "+response.status);
  let html=await response.text();
  if(!html.includes("REALTIME_IDS")||!html.includes("function renderMetrics()"))throw Error("Mã nguồn không đúng phiên bản thử nghiệm");
  html=replaceOnce(html,
   '.metric .unit{font-size:.6em;font-weight:700}',
   '.metric .unit{font-size:.6em;font-weight:700}.metric.energy .value.unit-below{white-space:normal;overflow-wrap:anywhere}.metric.energy .value.unit-below .unit{display:block;margin-top:2px;font-size:18px;line-height:1.1}');
  html=replaceOnce(html,
   'function labelValue(key,digits){return numText(item(key).raw,digits)}',
   `function labelValue(key,digits){return numText(item(key).raw,digits)}
function energyText(raw){
 const n=number(raw);
 if(n===null)return"--";
 const magnitude=Math.abs(n);
 if(magnitude>=10000)return Math.trunc(n).toLocaleString("vi-VN",{maximumFractionDigits:0});
 if(magnitude>=1000)return (Math.trunc(n*10)/10).toLocaleString("vi-VN",{minimumFractionDigits:1,maximumFractionDigits:1});
 return n.toLocaleString("vi-VN",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fitEnergyValue(){
 const el=$("energyValue"),parent=el?.parentElement;
 if(!el||!parent||!parent.clientWidth)return;
 el.classList.remove("unit-below");el.style.fontSize="";
 const baseline=parseFloat(getComputedStyle(el).fontSize)||34;
 const minSize=Math.min(18,baseline);
 for(let px=baseline;px>=minSize&&el.scrollWidth>parent.clientWidth+1;px-=1)
  el.style.fontSize=Math.max(minSize,px-1)+"px";
 if(el.scrollWidth>parent.clientWidth+1){el.style.fontSize=minSize+"px";el.classList.add("unit-below")}
}`);
  html=replaceOnce(html,
   ` for(const [k,id,digits] of [["humidity","humidityValue",0],["power_kw","powerValue",3],["energy_kwh","energyValue",2]]){
  const n=number(item(k).raw);
   $(id).textContent=n===null?"--":numText(n,digits)+" "+DEFS.find(x=>x.key===k).unit;
 }`,
   ` for(const [k,id,digits] of [["humidity","humidityValue",0],["power_kw","powerValue",3],["energy_kwh","energyValue",2]]){
  const n=number(item(k).raw);
  if(k==="energy_kwh"){
   const el=$(id);
   if(n===null)el.textContent="--";
   else{
    const amount=document.createElement("span"),unit=document.createElement("span");
    amount.textContent=energyText(n);
    unit.className="unit";unit.textContent=" kWh";
    el.replaceChildren(amount,unit);
   }
   fitEnergyValue();
  }else $(id).textContent=n===null?"--":numText(n,digits)+" "+DEFS.find(x=>x.key===k).unit;
 }`);
  html=replaceOnce(html,
   'window.addEventListener("resize",()=>{drawChart();scheduleMobileHeight()});',
   'window.addEventListener("resize",()=>{fitEnergyValue();drawChart();scheduleMobileHeight()});');
  // Render the original E-Ra widget in this same iframe (not in a nested iframe).
  document.open();document.write(html);document.close();
 }catch(error){
  const message=document.getElementById("loading");
  message.className="error";
  message.textContent="Không tải được Dashboard thử nghiệm: "+error.message;
  console.error("VOX Cool test loader:",error);
 }
})();
</script>
</body>
</html>
